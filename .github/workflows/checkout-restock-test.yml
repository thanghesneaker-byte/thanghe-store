name: Checkout restock - isolated PostgreSQL

on:
  push:
    branches: [v3-supabase-test]
    paths:
      - '.github/workflows/checkout-restock-test.yml'
      - 'supabase/migrations/20261029_store_checkout_v3_staged.sql'
      - 'supabase/migrations/20261103_store_checkout_cancel_restock.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-restock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: checkout_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tester -d checkout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: tester
      PGPASSWORD: disposable-test-only
      PGDATABASE: checkout_test
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Create disposable schema and apply real migrations
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE TABLE public.products (
            id uuid PRIMARY KEY,
            name text NOT NULL,
            price_vnd bigint NOT NULL,
            is_active boolean NOT NULL,
            deleted_at timestamptz
          );
          CREATE TABLE public.product_variants (
            id uuid PRIMARY KEY,
            product_id uuid NOT NULL REFERENCES public.products(id),
            size text NOT NULL,
            stock_quantity integer NOT NULL CHECK (stock_quantity >= 0)
          );
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_store_checkout_v3_staged.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103_store_checkout_cancel_restock.sql

      - name: Test exact sizes, rollback, cancellation, and permissions
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.products (id,name,price_vnd,is_active)
          VALUES ('11111111-1111-4111-8111-111111111111','Fake shoe',1000,true);
          INSERT INTO public.product_variants (id,product_id,size,stock_quantity)
          VALUES
            ('21111111-1111-4111-8111-111111111111','11111111-1111-4111-8111-111111111111','39',1),
            ('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','39',2),
            ('23333333-3333-4333-8333-333333333333','11111111-1111-4111-8111-111111111111','40',4),
            ('24444444-4444-4444-8444-444444444444','11111111-1111-4111-8111-111111111111','41',1);

          INSERT INTO public.store_checkout_orders_v3
            (id,request_id,customer_name,customer_phone,customer_address,items,total_vnd,status)
          VALUES
            ('31111111-1111-4111-8111-111111111111','41111111-1111-4111-8111-111111111111',
             'Test A','0900000001','Fake test address A',
             '[{"product_id":"11111111-1111-4111-8111-111111111111","size":"39","quantity":2}]',2000,'pending'),
            ('32222222-2222-4222-8222-222222222222','42222222-2222-4222-8222-222222222222',
             'Test B','0900000002','Fake test address B',
             '[{"product_id":"11111111-1111-4111-8111-111111111111","size":"40","quantity":1}]',1000,'pending'),
            ('33333333-3333-4333-8333-333333333333','43333333-3333-4333-8333-333333333333',
             'Test C','0900000003','Fake test address C',
             '[{"product_id":"11111111-1111-4111-8111-111111111111","size":"40","quantity":1}]',1000,'confirmed'),
            ('34444444-4444-4444-8444-444444444444','44444444-4444-4444-8444-444444444444',
             'Test D','0900000004','Fake test address D',
             '[{"product_id":"11111111-1111-4111-8111-111111111111","size":"40","quantity":2}]',2000,'pending'),
            ('35555555-5555-4555-8555-555555555555','45555555-5555-4555-8555-555555555555',
             'Test E','0900000005','Fake test address E',
             '[{"product_id":"11111111-1111-4111-8111-111111111111","size":"41","quantity":2}]',2000,'pending');

          DO $tests$
          DECLARE
            n integer;
            blocked boolean;
          BEGIN
            -- Order A: two units from two distinct size-39 variants.
            PERFORM public.store_v3_transition_checkout(
              '31111111-1111-4111-8111-111111111111','pending','confirmed');
            SELECT sum(quantity) INTO n
            FROM public.store_checkout_stock_movements_v3
            WHERE order_id='31111111-1111-4111-8111-111111111111' AND movement='deduct';
            IF n IS DISTINCT FROM 2 THEN RAISE EXCEPTION 'FAIL: deduction ledger'; END IF;
            SELECT count(*) INTO n FROM public.product_variants
            WHERE size='39' AND stock_quantity=0;
            IF n <> 1 THEN RAISE EXCEPTION 'FAIL: size-39 deduction'; END IF;
            SELECT stock_quantity INTO n FROM public.product_variants
            WHERE id='22222222-2222-4222-8222-222222222222';
            IF n <> 1 THEN RAISE EXCEPTION 'FAIL: second variant not deducted'; END IF;

            PERFORM public.store_v3_cancel_checkout(
              '31111111-1111-4111-8111-111111111111','confirmed','Test customer cancelled');
            SELECT sum(stock_quantity) INTO n FROM public.product_variants WHERE size='39';
            IF n <> 3 THEN RAISE EXCEPTION 'FAIL: exact restock'; END IF;
            SELECT count(*) INTO n FROM public.store_checkout_stock_movements_v3
            WHERE order_id='31111111-1111-4111-8111-111111111111' AND movement='restore';
            IF n <> 2 THEN RAISE EXCEPTION 'FAIL: restore ledger'; END IF;
            SELECT count(*) INTO n FROM public.store_checkout_status_history_v3
            WHERE order_id='31111111-1111-4111-8111-111111111111';
            IF n <> 2 THEN RAISE EXCEPTION 'FAIL: status history'; END IF;

            blocked := false;
            BEGIN
              PERFORM public.store_v3_cancel_checkout(
                '31111111-1111-4111-8111-111111111111','confirmed','Repeated cancellation');
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM LIKE '%Order status has changed%' THEN blocked := true;
              ELSE RAISE; END IF;
            END;
            IF NOT blocked THEN RAISE EXCEPTION 'FAIL: repeat cancellation allowed'; END IF;
            SELECT sum(stock_quantity) INTO n FROM public.product_variants WHERE size='39';
            IF n <> 3 THEN RAISE EXCEPTION 'FAIL: double restock'; END IF;

            -- Order B: pending cancellation never touches inventory.
            PERFORM public.store_v3_cancel_checkout(
              '32222222-2222-4222-8222-222222222222','pending','Customer changed mind');
            SELECT count(*) INTO n FROM public.store_checkout_stock_movements_v3
            WHERE order_id='32222222-2222-4222-8222-222222222222';
            IF n <> 0 THEN RAISE EXCEPTION 'FAIL: pending inventory changed'; END IF;

            -- Order C: legacy confirmed order has no deduction ledger.
            blocked := false;
            BEGIN
              PERFORM public.store_v3_cancel_checkout(
                '33333333-3333-4333-8333-333333333333','confirmed','Legacy order cancellation');
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM LIKE '%Unsafe restock%' THEN blocked := true;
              ELSE RAISE; END IF;
            END;
            IF NOT blocked THEN RAISE EXCEPTION 'FAIL: unsafe legacy restock'; END IF;

            -- Order D: shipping orders cannot use the cancellation RPC.
            PERFORM public.store_v3_transition_checkout(
              '34444444-4444-4444-8444-444444444444','pending','confirmed');
            PERFORM public.store_v3_transition_checkout(
              '34444444-4444-4444-8444-444444444444','confirmed','shipping');
            blocked := false;
            BEGIN
              PERFORM public.store_v3_cancel_checkout(
                '34444444-4444-4444-8444-444444444444','shipping','Shipping already begun');
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM LIKE '%Invalid cancellation request%' THEN blocked := true;
              ELSE RAISE; END IF;
            END;
            IF NOT blocked THEN RAISE EXCEPTION 'FAIL: shipping cancellation allowed'; END IF;

            -- Order E: failed confirmation rolls back stock and ledger.
            blocked := false;
            BEGIN
              PERFORM public.store_v3_transition_checkout(
                '35555555-5555-4555-8555-555555555555','pending','confirmed');
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM LIKE '%Insufficient stock%' THEN blocked := true;
              ELSE RAISE; END IF;
            END;
            IF NOT blocked THEN RAISE EXCEPTION 'FAIL: overstock allowed'; END IF;
            SELECT stock_quantity INTO n FROM public.product_variants WHERE size='41';
            IF n <> 1 THEN RAISE EXCEPTION 'FAIL: stock rollback'; END IF;
            SELECT count(*) INTO n FROM public.store_checkout_stock_movements_v3
            WHERE order_id='35555555-5555-4555-8555-555555555555';
            IF n <> 0 THEN RAISE EXCEPTION 'FAIL: ledger rollback'; END IF;

            SELECT stock_quantity INTO n FROM public.product_variants WHERE size='40';
            IF n <> 2 THEN RAISE EXCEPTION 'FAIL: wrong size changed'; END IF;
            IF has_function_privilege('anon',
                 'public.store_v3_cancel_checkout(uuid,text,text)','EXECUTE')
               OR has_function_privilege('authenticated',
                 'public.store_v3_cancel_checkout(uuid,text,text)','EXECUTE')
               OR NOT has_function_privilege('service_role',
                 'public.store_v3_cancel_checkout(uuid,text,text)','EXECUTE')
            THEN RAISE EXCEPTION 'FAIL: unsafe cancellation permissions'; END IF;
            RAISE NOTICE 'PASS: exact restock, no double restock, pending/legacy/shipping guards, atomic rollback and permissions';
          END $tests$;
          SQL
