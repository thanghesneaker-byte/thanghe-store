name: Checkout concurrency - isolated PostgreSQL

on:
  push:
    branches: [v3-supabase-test]
    paths:
      - .github/workflows/checkout-concurrency-test.yml

permissions:
  contents: read

jobs:
  test-concurrent-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: checkout_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tester -d checkout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: tester
      PGPASSWORD: disposable-test-only
      PGDATABASE: checkout_test
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Create disposable schema and load actual checkout migration
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE TABLE public.products (
            id uuid PRIMARY KEY,
            name text NOT NULL,
            price_vnd bigint NOT NULL,
            is_active boolean NOT NULL,
            deleted_at timestamptz
          );
          CREATE TABLE public.product_variants (
            id uuid PRIMARY KEY,
            product_id uuid NOT NULL REFERENCES public.products(id),
            size text NOT NULL,
            stock_quantity integer NOT NULL CHECK (stock_quantity >= 0)
          );
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_store_checkout_v3_staged.sql

      - name: Seed two fake pending orders competing for five pairs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.products (id, name, price_vnd, is_active)
          VALUES ('11111111-1111-4111-8111-111111111111','Test shoe',1000,true);
          INSERT INTO public.product_variants (id, product_id, size, stock_quantity)
          VALUES ('33333333-3333-4333-8333-333333333333',
                  '11111111-1111-4111-8111-111111111111','39',5);
          INSERT INTO public.store_checkout_orders_v3
            (id,request_id,customer_name,customer_phone,customer_address,items,total_vnd)
          VALUES
            ('44444444-4444-4444-8444-444444444444',
             '66666666-6666-4666-8666-666666666666','Khach A','0900000001',
             'Dia chi gia lap A',
             '[{"product_id":"11111111-1111-4111-8111-111111111111","name":"Test shoe","size":"39","quantity":4,"price_vnd":1000,"line_total_vnd":4000}]'::jsonb,4000),
            ('55555555-5555-4555-8555-555555555555',
             '77777777-7777-4777-8777-777777777777','Khach B','0900000002',
             'Dia chi gia lap B',
             '[{"product_id":"11111111-1111-4111-8111-111111111111","name":"Test shoe","size":"39","quantity":4,"price_vnd":1000,"line_total_vnd":4000}]'::jsonb,4000);
          SQL

      - name: Confirm the two fake orders concurrently
        shell: bash
        run: |
          set -uo pipefail
          psql -v ON_ERROR_STOP=1 -c "BEGIN; SELECT public.store_v3_transition_checkout('44444444-4444-4444-8444-444444444444','pending','confirmed'); SELECT pg_sleep(5); COMMIT;" > /tmp/a.log 2>&1 &
          a_pid=$!
          sleep 1
          psql -v ON_ERROR_STOP=1 -c "SELECT public.store_v3_transition_checkout('55555555-5555-4555-8555-555555555555','pending','confirmed');" > /tmp/b.log 2>&1 &
          b_pid=$!
          if wait "$a_pid"; then a_code=0; else a_code=$?; fi
          if wait "$b_pid"; then b_code=0; else b_code=$?; fi
          cat /tmp/a.log /tmp/b.log
          test "$a_code" -eq 0
          test "$b_code" -ne 0
          grep -q 'Insufficient stock to confirm order' /tmp/b.log

      - name: Verify atomic inventory and order statuses
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            n_confirmed integer;
            n_pending integer;
            n_stock integer;
          BEGIN
            SELECT count(*) FILTER (WHERE status='confirmed'),
                   count(*) FILTER (WHERE status='pending')
              INTO n_confirmed, n_pending
              FROM public.store_checkout_orders_v3;
            SELECT stock_quantity INTO n_stock
              FROM public.product_variants WHERE size='39';
            IF n_confirmed <> 1 OR n_pending <> 1 OR n_stock <> 1 THEN
              RAISE EXCEPTION 'Unsafe result: confirmed %, pending %, stock %',
                n_confirmed, n_pending, n_stock;
            END IF;
            RAISE NOTICE 'PASS: one confirmed, one pending, stock=1';
          END $$;
          SQL
          
      - name: Verify duplicate request ID is rejected
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            duplicate_blocked boolean := false;
            existing_count integer;
          BEGIN
            BEGIN
              INSERT INTO public.store_checkout_orders_v3
                (id, request_id, customer_name,
                 customer_phone, customer_address,
                 items, total_vnd)
              SELECT
                '88888888-8888-4888-8888-888888888888'::uuid,
                request_id, customer_name,
                customer_phone, customer_address,
                items, total_vnd
              FROM public.store_checkout_orders_v3
              WHERE id =
                '44444444-4444-4444-8444-444444444444'::uuid;
            EXCEPTION WHEN unique_violation THEN
              duplicate_blocked := true;
            END;

            SELECT COUNT(*) INTO existing_count
            FROM public.store_checkout_orders_v3
            WHERE request_id =
              '66666666-6666-4666-8666-666666666666'::uuid;

            IF NOT duplicate_blocked OR existing_count <> 1 THEN
              RAISE EXCEPTION
                'FAIL: duplicate request ID not blocked';
            END IF;

            RAISE NOTICE
              'PASS: duplicate request ID blocked';
          END $$;
          SQL

